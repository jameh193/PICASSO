<style>
:root{--ink:#15233B;--red:#C23B2E;--blue:#2F5D9E;--paper:#F6F6F4;--line:#D3D8E0;--steel:#5F6B7D;--ok:#2B7A57;--white:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:12px}
body{margin:0;font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--paper);color:var(--ink);line-height:1.75;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
a{color:var(--blue)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.top{background:var(--ink);color:#fff;padding:22px 0 18px}
.top .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-size:2.3rem;font-weight:900;line-height:1.2;letter-spacing:0}
.brand p{margin:2px 0 0;color:#B9C3D3;font-size:.95rem}
.top .exit{background:none;border:1.5px solid #5F6B7D;color:#fff;border-radius:6px;padding:4px 14px;min-height:40px}
.pole{height:16px;background:repeating-linear-gradient(-45deg,var(--red) 0 14px,#fff 14px 28px,var(--blue) 28px 42px,#fff 42px 56px)}
.seg{display:grid;grid-template-columns:1fr 1fr;border-bottom:1.5px solid var(--ink);margin:0 -16px}
.seg button{background:none;border:0;padding:12px 8px;font-weight:600;color:var(--steel);min-height:48px}
.seg button[aria-selected=true]{color:var(--ink);box-shadow:inset 0 -4px 0 var(--red);font-weight:800}
main{padding-bottom:40px}
h2{font-size:1.1rem;font-weight:800;margin:28px 0 10px;display:flex;align-items:center;gap:10px}
h2 .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-size:.9rem;flex:none}
.rows{display:grid;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:start;background:#fff;border:1.5px solid var(--ink);border-radius:6px;padding:10px 14px;min-height:56px;width:100%}
.row .t{font-weight:600}
.row .m{font-size:.85rem;color:var(--steel);text-align:end;line-height:1.5}
.row .m b{display:block;font-weight:600;color:inherit}
.row.on{background:var(--ink);color:#fff}
.row.on .m{color:#C9D2E0}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scroll-snap-type:x proximity}
.day{flex:none;width:72px;min-height:84px;background:#fff;border:1.5px solid var(--ink);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.5;scroll-snap-align:start}
.day .w{font-size:.8rem;color:var(--steel)}
.day .d{font-size:1.4rem;font-weight:800}
.day .mo{font-size:.8rem}
.day .s{font-size:.72rem;color:var(--red);font-weight:600}
.day.on{background:var(--ink);color:#fff}
.day.on .w{color:#C9D2E0}
.day:disabled{border-color:var(--line);color:#9AA3B2;background:#EEF0F3;cursor:not-allowed}
.day:disabled .w,.day:disabled .s{color:#9AA3B2}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.time{background:#fff;border:1.5px solid var(--ink);border-radius:6px;min-height:46px;font-weight:600}
.time.on{background:var(--ink);color:#fff}
.hint{color:var(--steel);margin:6px 0}
.field{display:block;margin:0 0 12px}
.field>span{display:block;font-weight:600;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--ink);border-radius:6px;background:#fff;min-height:46px}
.field textarea{min-height:76px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 22px;border-radius:6px;border:1.5px solid var(--ink);background:#fff;font-weight:800}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:42px;padding:0 16px;font-size:.92rem}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.summary{border-inline-start:6px solid var(--red);background:#fff;padding:12px 16px;margin:0 0 14px;border-radius:0 6px 6px 0}
html[dir=rtl] .summary{border-radius:6px 0 0 6px}
.summary b{font-weight:800}
.chip{display:inline-block;font-size:.8rem;font-weight:600;padding:0 10px;border-radius:99px;border:1.5px solid;line-height:1.7}
.chip.pending{color:var(--blue);border-color:var(--blue)}
.chip.confirmed{color:var(--ok);border-color:var(--ok)}
.chip.rejected,.chip.cancelled,.chip.declined{color:var(--red);border-color:var(--red)}
.chip.proposed{color:#8A5F00;border-color:#B88300}
.item{background:#fff;border:1.5px solid var(--ink);border-radius:6px;padding:12px 14px;margin:0 0 10px}
.item .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
.item .hd b{font-size:1.05rem}
.item p{margin:0;color:var(--steel)}
.item .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.empty{padding:28px 8px;text-align:center;color:var(--steel)}
.foot{margin-top:36px;padding-top:14px;border-top:1.5px solid var(--line);color:var(--steel);font-size:.9rem;text-align:center}
.foot a{color:var(--steel)}
/* admin */
.nav{position:fixed;inset-inline:0;bottom:0;background:#fff;border-top:1.5px solid var(--ink);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav button{background:none;border:0;min-height:58px;font-weight:600;color:var(--steel);position:relative}
.nav button[aria-selected=true]{color:var(--ink);font-weight:800;box-shadow:inset 0 4px 0 var(--red)}
.nav .bd{position:absolute;top:6px;margin-inline-start:6px;background:var(--red);color:#fff;border-radius:99px;font-size:.75rem;min-width:22px;line-height:22px;text-align:center;display:inline-block;position:static;margin-inline-start:6px}
.adm{padding-bottom:96px}
.dnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 10px}
.dnav h2{margin:0;font-size:1.05rem}
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px}
.strip .day{width:58px;min-height:72px}
.strip .day .d{font-size:1.15rem}
.strip .day .cnt{font-size:.72rem;font-weight:800;color:var(--red);min-height:1.2em}
.strip .day.on .cnt{color:#fff}
.tl{border-top:1.5px solid var(--ink);margin-top:8px}
.slot{display:grid;grid-template-columns:62px 1fr;border-bottom:1px solid var(--line);min-height:56px}
.slot .tm{padding:12px 0;color:var(--steel);font-size:.9rem}
.free{background:none;border:0;text-align:start;color:#8A93A3;padding:0 8px;min-height:56px;width:100%}
.free:hover{background:#ECEFF3}
.bk{width:100%;text-align:start;border:0;border-radius:4px;margin:4px 0;padding:8px 12px;border-inline-start:5px solid var(--blue);background:#E6EDF8;display:block}
.bk.confirmed{border-color:var(--ok);background:#E3F1EA}
.bk.proposed{border-color:#C98A00;background:#FBF1D9}
.bk b{display:block}
.bk span{font-size:.85rem;color:var(--steel)}
.cont{margin:0 0 0;border-inline-start:5px solid var(--blue);background:#E6EDF8;height:100%}
.cont.confirmed{border-color:var(--ok);background:#E3F1EA}
.cont.proposed{border-color:#C98A00;background:#FBF1D9}
.blk{width:100%;min-height:56px;text-align:start;border:0;padding:0 12px;color:var(--steel);background:repeating-linear-gradient(-45deg,#E4E7EC 0 8px,#EEF0F3 8px 16px)}
.blk small{margin-inline-start:8px;color:#8A93A3}
.rcpt{background:#fff;border:1.5px dashed var(--ink);border-radius:6px;padding:12px 14px;white-space:pre-line;line-height:1.9;margin:10px 0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.setgrp{border-top:1.5px solid var(--ink);padding-top:4px;margin-top:26px}
.setgrp h2{margin-top:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days7{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.days7 label{display:flex;align-items:center;gap:6px;border:1.5px solid var(--ink);border-radius:6px;background:#fff;padding:6px 12px;min-height:44px}
.days7 input{width:20px;height:20px;accent-color:var(--red)}
.svc{border:1.5px solid var(--ink);border-radius:6px;background:#fff;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:1fr 84px 112px 44px;gap:8px;align-items:center}
.svc input{width:100%;padding:8px;border:1.5px solid var(--line);border-radius:6px;min-height:42px;background:#fff}
.svc .x{min-height:42px;border:1.5px solid var(--red);border-radius:6px;background:#fff;color:var(--red);font-weight:800}
.svc small{grid-column:1/-1;color:var(--steel);margin-top:-4px}
.warn{background:#FFF1EF;border:1.5px solid var(--red);border-radius:6px;padding:10px 12px;margin-top:14px}
dialog{border:1.5px solid var(--ink);border-radius:8px;padding:18px;width:min(92vw,420px);color:var(--ink);background:var(--paper)}
dialog::backdrop{background:rgba(21,35,59,.55)}
dialog h3{margin:0 0 8px;font-size:1.15rem}
dialog .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#toast{position:fixed;inset-inline:16px;bottom:84px;margin:auto;max-width:360px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:6px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.show{opacity:1}
@media(max-width:380px){.svc{grid-template-columns:1fr 1fr}.svc .nm{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<script type="module">

const fromMin=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;

const fWeekS=mk({weekday:'short'}),fDay=mk({day:'numeric'}),fMon=mk({month:'long'}),fFull=mk({weekday:'long',day:'numeric',month:'long'});

const price=p=>p?`${Number(p).toLocaleString('fa-IR')} تومان`:'';

const $app=document.getElementById('app'),$dlg=document.getElementById('dlg');

const STATUS={pending:'در انتظار تأیید',confirmed:'تأیید شده',rejected:'رد شده',cancelled:'لغو شده',proposed:'پیشنهاد زمان جدید',declined:'پیشنهاد پذیرفته نشد'};

/* ---------- data ---------- */
const DEF=()=>({settings:{start:'10:00',end:'21:00',slot:30,horizon:14,daysOff:[5],closedDates:[],blocks:[],vipDates:[],deposit:0,depositVip:0,cardNumber:'',cardName:'',phone:'',address:''},

 bookings:[],cells:[]});

const cardRaw=()=>String(db.settings.cardNumber||'').replace(/\D/g,'');

 const a=depAmt(date);if(!a)return '';const s=db.settings;
 return `<div class="depbox"><h3>پرداخت بیعانه</h3><p>برای ثبت نوبت، مبلغ <b>${price(a)}</b> را کارت‌به‌کارت واریز کنید.</p><div class="cardno" dir="ltr">${fmtCard(s.cardNumber)}</div>${s.cardName?`<p class="cardname">به نام ${esc(s.cardName)}</p>`:''}<button class="btn sm primary" data-act="copycard">کپی شماره کارت</button><div class="depwarn">تا زمانی که بیعانه واریز نشود، نوبت شما ثبت نمی‌شود.</div></div>`;
}
/* ---------- VIP helpers ---------- */
const isVip=d=>Array.isArray(db.settings.vipDates)&&db.settings.vipDates.includes(d);
const svcPrice=(x,d)=>(isVip(d)&&x&&x.vipPrice>0)?x.vipPrice:((x&&x.price)||0);
const bookingVip=b=>b.vip!=null?!!b.vip:isVip(b.date);
const bookingPrice=b=>b.price!=null?b.price:svcPrice(db.services.find(x=>x.id===b.sid),b.date);
const vipChip=b=>bookingVip(b)?'<span class="chip vip">VIP</span>':'';
const priceP=b=>bookingPrice(b)?`<p>هزینه: ${price(bookingPrice(b))}</p>`:'';
function svcPriceHtml(x){
 if(P.date&&isVip(P.date))return `<em class="vp">${price(svcPrice(x,P.date))||'نرخ VIP'}</em>`;
 if(P.date)return price(x.price);
 return price(x.price)+((x.vipPrice>0&&x.vipPrice!==x.price)?`<em class="vp">VIP: ${price(x.vipPrice)}</em>`:'');
}
function vipSection(){
 const list=(db.settings.vipDates||[]).filter(d=>d>=today()).sort();
 return `<div class="setgrp"><h2>روزهای VIP</h2><p class="hint">برای VIP کردن یک روز، در تب «تقویم» همان روز را باز کنید و دکمه «VIP کردن این روز» را بزنید. در روزهای VIP، قیمت VIP خدمات اعمال می‌شود.</p>`+
 (list.length?list.map(d=>`<div class="item" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>${fFull.format(parse(d))}</b><span style="display:flex;gap:6px"><button class="btn sm" data-act="goday" data-d="${d}">دیدن</button><button class="btn sm danger" data-act="unvip" data-d="${d}">برداشتن</button></span></div>`).join(''):`<p class="empty">هنوز روز VIP تعریف نشده.</p>`)+`</div>`;
}
const LPK='rish-o-ghaichi:phone';
const getLP=()=>{try{return localStorage.getItem(LPK)||''}catch(e){return ''}};

/* ---------- backend (Supabase) ---------- */
let ADMIN_EMAIL='',sb=null,session=null,appState='loading',lastErr='',shown=false,chan=null,pt=null;

const isAdminUser=()=>!!(session&&session.user&&!session.user.is_anonymous);
const withTimeout=(p,ms=15000)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);
const errText=e=>(e&&(e.message||e.code))||'error';

 const q='.days,.strip',sc=[...document.querySelectorAll(q)].map(e=>e.scrollLeft),y=window.scrollY;

}
async function loadAll(){
 const admin=isAdminUser(),me=myUid();
 const bq=admin?sb.from('bookings').select('*').gte('date',addDays(today(),-30)):sb.from('bookings').select('*').eq('uid',me);
 const [c,k,b]=await Promise.all([sb.from('config').select('*').eq('id','main').maybeSingle(),sb.from('cells').select('*').gte('date',addDays(today(),-1)),bq]);
 const err=c.error||k.error||b.error;if(err)throw err;
 if(c.data){
  db.settings=Object.assign(DEF().settings,c.data.settings||{});delete db.settings.pin;
  if(!Array.isArray(db.settings.vipDates))db.settings.vipDates=[];
  if(Array.isArray(c.data.services)&&c.data.services.length)db.services=c.data.services;
 }else if(admin)saveCfg();

 if(!sb||!session)return;

 sb.from('config').upsert({id:'main',settings:db.settings,services:db.services}).then(({error})=>{if(error)toast('ذخیره نشد. اتصال یا دسترسی را بررسی کنید.')});

 const c=b.cells.map((id,i)=>({id,date:b.date,t:t0+i*sl}));

const isPast=b=>{const n=new Date(),t=today();if(b.date<t)return true;if(b.date>t)return false;return n.getHours()*60+n.getMinutes()>=toMin(b.time)+b.n*db.settings.slot};
const nSlots=min=>Math.max(1,Math.ceil(min/db.settings.slot));

/* ---------- availability ---------- */
function blockMap(date){
 const m={},s=db.settings,sl=s.slot;
 for(const k of s.blocks){if(k.date!==date)continue;const f=toMin(k.from),e=toMin(k.to);
  for(let t=toMin(s.start);t<toMin(s.end);t+=sl)if(t+sl>f&&t<e)m[t]=k}
 return m;
}
function occupied(date){
 const set=new Set();
 for(const t in blockMap(date))set.add(+t);
 for(const c of db.cells)if(c.date===date)set.add(c.t);
 return set;
}
function isOpen(date){return !db.settings.daysOff.includes(parse(date).getDay())&&!db.settings.closedDates.includes(date)}
function canFit(date,t,n){
 if(!isOpen(date))return false;
 const {start,end,slot}=db.settings;
 if(t<toMin(start)||t+n*slot>toMin(end))return false;
 const occ=occupied(date);
 for(let i=0;i<n;i++)if(occ.has(t+i*slot))return false;
 return true;
}
function freeStarts(date,n){
 const {start,end,slot}=db.settings,now=new Date(),isToday=date===iso(now),nowM=now.getHours()*60+now.getMinutes(),out=[];
 for(let t=toMin(start);t+n*slot<=toMin(end);t+=slot){if(isToday&&t<=nowM)continue;if(canFit(date,t,n))out.push(t)}
 return out;
}

 if(k==='proposed'&&b.orig)t+=`\nزمان درخواستی شما: ${fFull.format(parse(b.orig.date))}، ساعت ${T(b.orig.time)}`;
 if(bookingVip(b))t+=`\nنوع نوبت: VIP`;if(bookingPrice(b))t+=`\nهزینه: ${price(bookingPrice(b))}`;
 t+=`\nوضعیت: ${stLbl(k)}`;
 if(k==='proposed')t+='\nبرای پذیرش یا رد پیشنهاد، بخش «نوبت‌های من» را ببینید یا با آرایشگاه تماس بگیرید.';

 return t;
}

 let h=`<div class="dnav"><button class="btn sm" data-act="shift" data-n="1" aria-label="روز بعد">روز بعد</button><h2>${fFull.format(dt)}</h2><button class="btn sm" data-act="shift" data-n="-1" aria-label="روز قبل">روز قبل</button></div><div class="strip">`;
 for(let i=0;i<14;i++){const x=addDays(A.stripStart,i),xd=parse(x);
  h+=`<button class="day ${x===d?'on':''}${isVip(x)?' vip':''}" data-act="goday" data-d="${x}"><span class="w">${fWeekS.format(xd)}</span><span class="d">${fa(fDay.format(xd))}</span><span class="cnt">${counts[x]?fa(counts[x]):(isVip(x)?'VIP':'')}</span></button>`}
 h+=`</div><div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap">${d!==today()?`<button class="btn sm" data-act="goday" data-d="${today()}">امروز</button>`:''}`;
 const weekly=s.daysOff.includes(dt.getDay()),closed=s.closedDates.includes(d);
 if(!weekly)h+=`<button class="btn sm ${closed?'':'danger'}" data-act="toggleday">${closed?'باز کردن این روز':'تعطیل کردن این روز'}</button>`;
 if(!weekly&&!closed)h+=`<button class="btn sm primary" data-act="togglevip">${isVip(d)?'برداشتن VIP از این روز':'VIP کردن این روز'}</button>`;
if(!weekly&&!closed)h+=`<button class="btn sm" data-act="blockhours">بستن ساعتی یا نیم‌روز</button>`;
 h+=`</div>`;
 if(isVip(d)&&isOpen(d))h+=`<div class="vipbar">روز VIP — نوبت‌های این روز با نرخ VIP ثبت می‌شوند.</div>`;
if(!isOpen(d))return h+`<p class="empty">${weekly?'این روز تعطیل هفتگی است.':'این روز تعطیل شده است.'}</p>`;
 const map={},bm=blockMap(d);
 db.bookings.forEach(b=>{if(b.date!==d||!active(b))return;const t=toMin(b.time);for(let i=0;i<b.n;i++)map[t+i*sl]={b,first:i===0}});
 h+=`<div class="tl${isVip(d)?' vip':''}">`;
 for(let t=toMin(s.start);t<toMin(s.end);t+=sl){
  const m=map[t];let cell;
  if(!m)cell=bm[t]?`<button class="blk" data-act="unblock" data-id="${bm[t].id}">بسته${bm[t].note?` (${esc(bm[t].note)})`:''}<small>برای برداشتن لمس کنید</small></button>`:`<button class="free" data-act="addslot" data-t="${t}">خالی</button>`;
  else if(m.first)cell=`<button class="bk ${m.b.status}${isPast(m.b)?' past':''}" data-act="bk" data-id="${m.b.id}"><b>${esc(m.b.name)}${bookingVip(m.b)?' <span class="chip vip">VIP</span>':''}</b><span>${esc(m.b.sname)}</span> ${m.b.status!=='confirmed'?chip(m.b.status):''}${isPast(m.b)?'<span class="chip past">زمان گذشته</span>':''}</button>`;
  else cell=`<div class="cont ${m.b.status}${isPast(m.b)?' past':''}"></div>`;
  h+=`<div class="slot"><div class="tm">${T(t)}</div><div>${cell}</div></div>`;
 }
 return h+`</div>`;
}

 if(!keep||!R||R.id!==id)R={id,date:null,time:null,propose:false};
 let h=`<h3>رد درخواست ${esc(b.name)}</h3><p style="margin:0">${esc(b.sname)}</p><p style="margin:0 0 6px">${fFull.format(parse(b.date))}، ساعت ${T(b.time)}</p>`;
 if(!R.propose){

 }else{
  h+=`<p class="hint">یک زمان خالی برای پیشنهاد انتخاب کنید.</p><div class="days">`;

 }

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 const a=el.dataset.act,id=el.dataset.id;
 const setStatus=async(st,msg)=>{if(await setBookingStatus(id,st)){closeDlg();render();toast(msg);return true}return false};
 switch(a){
  /* public */
  case'tab':P.tab=el.dataset.tab;P.done=null;render();window.scrollTo(0,0);break;
  case'newbook':P.done=null;P.tab='book';render();window.scrollTo(0,0);break;
  case'svc':P.sid=id;P.date=null;P.time=null;render('s2');break;
  case'day':P.date=el.dataset.d;P.time=null;render('s3');break;
  case'time':P.time=+el.dataset.t;render('s4');break;
  case'submit':submitBooking();break;
  case'reload':location.reload();break;
  case'mycancel':if(confirm('این نوبت لغو شود؟'))setStatus('cancelled','نوبت لغو شد.');break;
  /* admin */
  case'logout':sb.auth.signOut().catch(()=>{});location.hash='#/';break;
  case'atab':A.tab=el.dataset.tab;render();window.scrollTo(0,0);break;
  case'approve':setBookingStatus(id,'confirmed').then(ok=>{if(ok){closeDlg();render();toast('نوبت تأیید شد.');showMsg(id,'confirmed',true)}});break;
  case'reject':showReject(id);break;
  case'admcancel':if(confirm('این نوبت لغو شود؟'))setStatus('cancelled','نوبت لغو شد.').then(ok=>{if(ok)showMsg(id,'cancelled',true)});break;
  case'goday':A.date=el.dataset.d;A.tab='cal';render();window.scrollTo(0,0);break;
  case'shift':A.date=addDays(A.date,+el.dataset.n);render();break;
  case'toggleday':{const cl=db.settings.closedDates,i=cl.indexOf(A.date);
   if(i>=0)cl.splice(i,1);else{const has=db.bookings.some(b=>b.date===A.date&&active(b));if(has&&!confirm('در این روز نوبت ثبت شده است. باز هم تعطیل شود؟'))break;cl.push(A.date)}
   saveCfg();render()}break;
  case'togglevip':{const v=db.settings.vipDates,i=v.indexOf(A.date);if(i>=0)v.splice(i,1);else v.push(A.date);saveCfg();render();toast(i>=0?'VIP این روز برداشته شد.':'این روز VIP شد.')}break;
  case'unvip':{db.settings.vipDates=db.settings.vipDates.filter(x=>x!==el.dataset.d);saveCfg();render();toast('VIP برداشته شد.')}break;
  case'copycard':copyText(cardRaw());break;
  case'proofwa':{const ph=String(db.settings.phone).replace(/\D/g,'');window.open(`https://wa.me/98${ph.replace(/^0/,'')}?text=${encodeURIComponent(proofText(P.done))}`,'_blank')}break;
  case'proofsms':{const ph=String(db.settings.phone).replace(/\D/g,'');location.href=`sms:${ph}?&body=${encodeURIComponent(proofText(P.done))}`}break;
  case'bk':showBooking(id);break;
  case'addslot':showAdd(+el.dataset.t);break;
  case'closedlg':closeDlg();break;
  case'receipt':showMsg(id,undefined,false);break;
  case'notify':showMsg(id,undefined,true);break;
  case'share':if(navigator.share)navigator.share({text:MSG.text}).catch(()=>{});else copyText(MSG.text);break;
  case'copy':copyText(MSG.text);break;
  case'sms':location.href=`sms:${MSG.phone}?&body=${encodeURIComponent(MSG.text)}`;break;
  case'wa':window.open(`https://wa.me/98${MSG.phone.replace(/^0/,'')}?text=${encodeURIComponent(MSG.text)}`,'_blank');break;
  case'acceptprop':setStatus('confirmed','نوبت جدید تأیید شد.');break;
  case'declineprop':if(confirm('این پیشنهاد را نمی‌پذیرید؟'))setStatus('declined','پیشنهاد رد شد.');break;
  case'doreject':setBookingStatus(id,'rejected').then(ok=>{if(ok){closeDlg();render();toast('درخواست رد شد.');showMsg(id,'rejected',true)}});break;
  case'goprop':R.propose=true;showReject(id,true);break;
  case'rback':R.propose=false;showReject(id,true);break;
  case'rday':R.date=el.dataset.d;R.time=null;showReject(R.id,true);break;
  case'rtime':R.time=+el.dataset.t;showReject(R.id,true);break;
  case'doprop':{const b=db.bookings.find(x=>x.id===id);if(!b||!R||R.time==null)break;
   if(!freeStarts(R.date,b.n).includes(R.time)){toast('این زمان دیگر خالی نیست.');showReject(id,true);break}
   const rd=R.date,rt=R.time,sl=db.settings.slot,c=cellIds(rd,rt,b.n).map((cid,i)=>({id:cid,date:rd,t:rt+i*sl}));
   sb.rpc('propose_booking',{p_id:id,p_date:rd,p_time:fromMin(rt),c}).then(async({error})=>{if(error)return toast('ثبت پیشنهاد انجام نشد.');await pull();closeDlg();render();toast('پیشنهاد ثبت شد.');showMsg(id,'proposed',true)})}break;
  case'blockhours':showBlock(toMin(db.settings.start),Math.min(toMin(db.settings.start)+2*db.settings.slot,toMin(db.settings.end)));break;
  case'blockhere':showBlock(+el.dataset.t,Math.min(+el.dataset.t+db.settings.slot,toMin(db.settings.end)));break;
  case'blkpre':{const s0=toMin(db.settings.start),e0=toMin(db.settings.end),sl=db.settings.slot,mid=s0+Math.round((e0-s0)/2/sl)*sl;
   const f=document.getElementById('b-from'),t=document.getElementById('b-to');
   if(el.dataset.p==='m'){f.value=s0;t.value=mid}else{f.value=mid;t.value=e0}}break;
  case'saveblk':{const f=+document.getElementById('b-from').value,e=+document.getElementById('b-to').value;
   if(e<=f)return toast('ساعت پایان باید بعد از شروع باشد.');
   const sl=db.settings.slot,ov=db.bookings.filter(b=>b.date===A.date&&active(b)&&toMin(b.time)<e&&toMin(b.time)+b.n*sl>f).length;
   if(ov&&!confirm(`${fa(ov)} نوبت در این بازه ثبت شده و خودکار لغو نمی‌شود. باز هم بسته شود؟`))break;
   db.settings.blocks.push({id:uid(),date:A.date,from:fromMin(f),to:fromMin(e),note:document.getElementById('b-note').value.trim()});saveCfg();closeDlg();render();toast('بازه بسته شد.')}break;
  case'unblock':if(confirm('بسته بودن این بازه برداشته شود؟')){db.settings.blocks=db.settings.blocks.filter(k=>k.id!==id);saveCfg();render()}break;
  case'saveadd':{const name=document.getElementById('a-name').value.trim();if(!name)return toast('نام مشتری را وارد کنید.');
   const phone=en(document.getElementById('a-phone').value).replace(/[\s-]/g,''),svc=db.services.find(x=>x.id===document.getElementById('a-svc').value),n=nSlots(svc.min),t=+el.dataset.t;
   if(!canFit(A.date,t,n))return toast('این ساعت برای این خدمت کافی نیست.');
   placeBooking({id:uid(),date:A.date,time:fromMin(t),sid:svc.id,sname:svc.name,n,name,phone,note:'',code:newCode(),price:svcPrice(svc,A.date),vip:isVip(A.date),status:'confirmed',created:Date.now(),uid:myUid(),cells:cellIds(A.date,t,n)}).then(()=>{closeDlg();render();toast('نوبت ثبت شد.')}).catch(()=>toast('ثبت نشد. شاید این ساعت پر شده یا اتصال قطع است.'))}break;
  case'addsvc':db.services.push({id:uid(),name:'خدمت جدید',min:30,price:0});saveCfg();render();break;
  case'delsvc':if(db.services.length<2)return toast('حداقل یک خدمت باید بماند.');if(confirm('این خدمت حذف شود؟ نوبت‌های قبلی تغییر نمی‌کنند.')){db.services=db.services.filter(x=>x.id!==id);saveCfg();render()}break;
  case'setpin':{const v=en(document.getElementById('newpin').value).trim();if(!/^\d{6}$/.test(v))return toast('رمز باید دقیقاً ۶ رقم باشد.');
   sb.auth.updateUser({password:v}).then(({error})=>{if(error)return toast('تغییر رمز انجام نشد.');document.getElementById('newpin').value='';toast('رمز تغییر کرد.')})}break;
  case'export':{const blob=new Blob([JSON.stringify({settings:db.settings,services:db.services,bookings:db.bookings},null,1)],{type:'application/json'}),u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download=`rish-o-ghaichi-${today()}.json`;l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}break;
 }
});
let loggingIn=false;
async function doLogin(){
 if(loggingIn||!sb)return;
 const FK='rg:fails',now=Date.now();let f={n:0,until:0};
 try{f=JSON.parse(localStorage.getItem(FK))||f}catch(e){}
 if(f.until>now)return toast(`چند بار رمز اشتباه زده شد. ${fa(Math.ceil((f.until-now)/60000))} دقیقه دیگر تلاش کنید.`);
 const emEl=document.getElementById('em'),email=ADMIN_EMAIL||(emEl?emEl.value.trim():''),pw=en(document.getElementById('pin').value).trim();
 if(!email||!pw)return toast('رمز را وارد کنید.');
 loggingIn=true;
 const {error}=await sb.auth.signInWithPassword({email,password:pw});
 loggingIn=false;
 if(error){
  f.n=(f.n||0)+1;if(f.n>=5){f={n:0,until:Date.now()+5*60000}}
  try{localStorage.setItem(FK,JSON.stringify(f))}catch(e){}
  const pinEl=document.getElementById('pin');if(pinEl)pinEl.value='';
  return toast(/network|fetch/i.test(error.message||'')?'اتصال اینترنت برقرار نیست.':/rate|too many/i.test(error.message||'')?'تلاش‌های زیاد؛ کمی بعد دوباره امتحان کنید.':'رمز اشتباه است.');
 }
 try{localStorage.removeItem(FK)}catch(e){}
 const g=await sb.auth.getSession();session=g.data.session;
 if(document.activeElement)document.activeElement.blur();
 await pull();render();
}
document.addEventListener('submit',e=>{
 if(e.target.id!=='login')return;e.preventDefault();doLogin();
});
document.addEventListener('input',e=>{
 const id=e.target.id;
 if(id==='f-name')P.name=e.target.value;
 else if(id==='f-phone')P.phone=e.target.value;
 else if(id==='f-note')P.note=e.target.value;
 else if(id==='f-look')P.lookInput=e.target.value;
 else if(id==='pin'&&en(e.target.value).trim().length>=6)doLogin();
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.set){
  const k=t.dataset.set;let v=t.value;
  if(k==='slot'||k==='horizon')v=+v;
  else if(k==='deposit'||k==='depositVip')v=Math.max(0,+en(v)||0);
  else if(k==='cardNumber'){v=en(v).replace(/\D/g,'');if(v&&v.length!==16){toast('شماره کارت باید ۱۶ رقم باشد.');return}}
  if(k==='start'||k==='end'){const s={...db.settings,[k]:v};if(toMin(s.end)<=toMin(s.start)){toast('ساعت پایان باید بعد از شروع باشد.');render();return}}
  db.settings[k]=v;saveCfg();toast('ذخیره شد.');if(k==='slot'||k==='start'||k==='end')render();
 }else if(t.dataset.day!==undefined){
  const v=+t.dataset.day,set=new Set(db.settings.daysOff);t.checked?set.add(v):set.delete(v);db.settings.daysOff=[...set];saveCfg();toast('ذخیره شد.');
 }else if(t.dataset.svc){
  const x=db.services.find(s=>s.id===t.dataset.svc),f=t.dataset.f;if(!x)return;
  if(f==='name'){x.name=t.value.trim()||x.name}else if(f==='min'){x.min=Math.max(5,+en(t.value)||x.min)}else if(f==='vipPrice'){x.vipPrice=Math.max(0,+en(t.value)||0)}else{x.price=Math.max(0,+en(t.value)||0)}
  saveCfg();toast('ذخیره شد.');
 }else if(t.id==='imp'&&t.files[0]){
  const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.settings||!Array.isArray(d.services))throw 0;
   if(!confirm('تنظیمات و خدمات فعلی با فایل جایگزین شود؟'))return;db.settings=Object.assign(DEF().settings,d.settings);delete db.settings.pin;db.services=d.services;saveCfg();render();toast('بازیابی شد.')}catch(err){toast('فایل پشتیبان معتبر نیست.')}};
  r.readAsText(t.files[0]);
 }
});

/* ---------- start ---------- */
render();
initBackend();
setInterval(()=>{if(isAdminRoute()&&isAuthed()&&A.tab==='cal'&&!$dlg.open&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){const y=scrollY;render();scrollTo(0,y)}},30000);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
